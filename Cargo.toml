[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/shared",
    "crates/audio",
    "crates/inference",
    "crates/desktop",
    "crates/web",
	"crates/utilities",
]

[workspace.package]
version = "0.2.0"
authors = ["Liam <spodeian@proton.me>"]
edition = "2024"
license = "CC-BY-NC-SA-4.0"
readme = "README.md"
description = "RainAI · Real-time neural spatial soundscape synthesis studio in Rust, WebGPU, and WebAssembly"
repository = "https://github.com/Spodeian/RainAI"

[workspace.dependencies]
shared = { path = "crates/shared" }
audio = { path = "crates/audio" }
inference = { path = "crates/inference" }
app = { path = "crates/app" }
utilities = { path = "crates/utilities" }
candle-core = "0.11"
candle-nn = "0.11"
criterion = "0.5"
hound = "3.5"
rayon = "1.10"
bytemuck = { version = "1.15", features = ["derive"] }
wgpu = "30"
eframe = { version = "0.36", default-features = false, features = ["default_fonts"] }
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "ansi", "tracing-log"] }
tracing-web = "0.1"
thiserror = "2.0"
anyhow = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3"
console_error_panic_hook = "0.1"
bson = "2"
miniz_oxide = "0.8"
base64 = "0.22"
ron = "0.12"
ringbuf = "0.3"
tqdm = "0.4"
reqwest = "0.12"
rand = "0.8"
rand_distr = "0.4"
rustfft = "6"
ratatui = "0.26"
crossterm = "0.27"
sysinfo = "0.30"
tokio = "1"
futures = "0.3"
futures-intrusive = "0.5"
safetensors = "0.4"
winit = { version = "0.30", default-features = false }
android-activity = { version = "0.6", default-features = false, features = ["native-activity"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
collapsible_if = "allow"
collapsible_match = "allow"
needless_range_loop = "allow"
too_many_arguments = "allow"
needless_borrow = "allow"
nonminimal_bool = "allow"
get_first = "allow"
approx_constant = "allow"
match_like_matches_macro = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
incremental = false
rpath = false

[profile.release-wasm]
inherits = "release"
opt-level = "z"

[profile.release.build-override]
opt-level = 2
codegen-units = 256
overflow-checks = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true
strip = true
overflow-checks = false
incremental = false

[profile.dev]
opt-level = 0
codegen-units = 256
debug = true

[profile.dev.build-override]
opt-level = 2
overflow-checks = false
