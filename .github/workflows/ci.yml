name: CI & Edge Deployment Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # 1. Lint and Static Code Analysis
  lint:
    name: Clippy & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify Code Formatting
        run: cargo fmt --all --check

      - name: Run Workspace Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # 2. Ultra-Fast Parallel Nextest Execution
  test-nextest:
    name: Nextest Workspace Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Audio & Windowing Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Execute Workspace Unit & Integration Tests via Nextest
        run: cargo nextest run --workspace --all-targets --profile ci

      - name: Run Documentation Tests
        run: cargo test --doc --workspace

  # 3. WebAssembly & Serverless Edge Build Verification
  wasm-edge-build:
    name: WASM & Cloudflare Edge Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust with WASM Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk and wasm-opt
        uses: taiki-e/install-action@v2
        with:
          tool: trunk,wasm-opt

      - name: Check Web Crate for wasm32-unknown-unknown
        run: cargo check -p web --target wasm32-unknown-unknown

      - name: Build Web Application via Trunk
        run: trunk build --release

      - name: Verify Cloudflare Pages Output Distribution
        run: |
          test -f crates/web/dist/index.html || exit 1
          test -f crates/web/dist/manifest.json || exit 1
          test -f crates/web/dist/sw.js || exit 1
          test -f crates/web/dist/_headers || exit 1
          test -f crates/web/dist/_redirects || exit 1
          echo "All serverless edge distribution assets verified!"

      - name: Upload Web Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: serverless-edge-dist
          path: crates/web/dist/
          retention-days: 7

  # 4. Multi-Platform Desktop Optimized Release Builds
  desktop-build:
    name: Desktop Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Audio & GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compile Native Desktop Binary (Optimized Release)
        run: cargo build --package desktop --release

      - name: Upload Desktop Binary Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x86_64
          path: target/release/desktop.exe
          retention-days: 14

      - name: Upload Desktop Binary Artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x86_64
          path: target/release/desktop
          retention-days: 14

      - name: Upload Desktop Binary Artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-universal
          path: target/release/desktop
          retention-days: 14

  # 5. Serverless Deployment Script Dry-Run Validation
  deploy-script-validation:
    name: Validate Edge Deploy Script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Syntax Check deploy.sh
        run: bash -n deploy.sh
