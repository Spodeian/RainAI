[package]
name = "inference"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Neural inference runtime for Mamba2-MoE and Diff-Autoencoder models"

[lints]
workspace = true

[dependencies]
shared = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
ringbuf = { workspace = true }
futures-intrusive = "0.5"
safetensors = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Window", "HtmlCanvasElement", "Element", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlDocument", "Location", "AudioContext", "AudioContextOptions", "AudioBuffer", "AudioBufferSourceNode", "AudioDestinationNode", "AudioNode", "GainNode", "ScriptProcessorNode", "AudioProcessingEvent", "Response"] }
js-sys = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
futures = { workspace = true }

[[bench]]
name = "kernel_benchmarks"
harness = false

[[bench]]
name = "backend_comparison"
harness = false

