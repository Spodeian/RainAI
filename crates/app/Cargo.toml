[package]
name = "app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Application view controller, UI layout components, and state management"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
eframe = { workspace = true }
egui = { workspace = true, features = ["default_fonts"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
shared = { workspace = true }
audio = { workspace = true }
inference = { workspace = true }
bson = { workspace = true }
miniz_oxide = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
ron = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Window", "HtmlCanvasElement", "Element", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlDocument", "Location", "AudioContext", "AudioContextOptions", "AudioBuffer", "AudioBufferSourceNode", "AudioDestinationNode", "AudioNode", "GainNode", "ScriptProcessorNode", "AudioProcessingEvent"] }
js-sys = { workspace = true }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
eframe = { workspace = true, features = ["x11", "wayland"] }

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
android-activity = { workspace = true }

[features]
default = ["accesskit", "persistence", "wgpu"]
accesskit = ["eframe/accesskit"]
persistence = ["eframe/persistence"]
wgpu = ["eframe/wgpu"]
glow = ["eframe/glow"]

