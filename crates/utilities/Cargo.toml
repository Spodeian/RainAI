[package]
name = "utilities"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
metal = ["candle-core/metal", "candle-nn/metal"]

[lib]
name = "utilities"
path = "src/lib.rs"

[[bin]]
name = "rainai_upmix"
path = "src/bin/spatial_upmix.rs"
test = false

[[bin]]
name = "rainai_features"
path = "src/bin/features.rs"
test = false

[[bin]]
name = "rainai_synth"
path = "src/bin/synth_rain.rs"
test = false

[[bin]]
name = "rainai_ingest"
path = "src/bin/ingest.rs"
test = false

[[bin]]
name = "rainai_studio"
path = "src/bin/tui.rs"
test = false

[[bin]]
name = "rainai_golden_vectors"
path = "src/bin/golden_vectors.rs"
test = false

[[bin]]
name = "rainai_train_candle"
path = "src/bin/train_candle.rs"
test = false


[dependencies]
shared = { workspace = true }
audio = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
ratatui = { workspace = true }
rayon = { workspace = true }
rustfft = { workspace = true }
serde_json = { workspace = true }
sysinfo = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hound = { workspace = true }
serde = { workspace = true, features = ["derive"] }
reqwest = { workspace = true, features = ["blocking", "json", "stream", "rustls-tls"] }
crossterm = { workspace = true }
tokio = { workspace = true, features = ["full"] }
futures = { workspace = true }
sha2 = "0.10"

